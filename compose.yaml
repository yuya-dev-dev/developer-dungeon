name: developer-dungeon

services:
  postgres:
    image: postgres:18.4-alpine3.23@sha256:865a3cfdac164ea2608bea36342a9bb5c11e99b5aa8ed9b83b662185e556e178
    platform: linux/amd64
    restart: "no"
    ports:
      - "127.0.0.1:15432:5432"
    environment:
      POSTGRES_DB: developer_dungeon
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
    secrets:
      - db_admin_password
      - db_migrator_password
      - db_app_password
    volumes:
      - developer-dungeon-postgres-data:/var/lib/postgresql
      - ./database/init/001-roles.sh:/docker-entrypoint-initdb.d/001-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d developer_dungeon"]
      interval: 2s
      timeout: 2s
      retries: 20
    labels:
      io.developer-dungeon.project: developer-dungeon
      io.developer-dungeon.owner: local-runtime

secrets:
  db_admin_password:
    file: ${DEVELOPER_DUNGEON_DB_ADMIN_PASSWORD_FILE}
  db_migrator_password:
    file: ${DEVELOPER_DUNGEON_DB_MIGRATOR_PASSWORD_FILE}
  db_app_password:
    file: ${DEVELOPER_DUNGEON_DB_APP_PASSWORD_FILE}

volumes:
  developer-dungeon-postgres-data:
    name: developer-dungeon-postgres-data
    labels:
      io.developer-dungeon.project: developer-dungeon
      io.developer-dungeon.owner: local-runtime

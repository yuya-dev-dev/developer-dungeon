server.address=127.0.0.1
server.port=8080
spring.application.name=developer-dungeon-app
spring.thymeleaf.cache=false
developer-dungeon.runner-client.base-url=${DEVELOPER_DUNGEON_RUNNER_URL:http://127.0.0.1:18081}
developer-dungeon.runner-client.token=${DEVELOPER_DUNGEON_RUNNER_TOKEN:}
spring.datasource.url=${DEVELOPER_DUNGEON_APP_DB_URL}
spring.datasource.username=${DEVELOPER_DUNGEON_APP_DB_USER}
spring.datasource.password=${DEVELOPER_DUNGEON_APP_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=4
spring.flyway.enabled=false

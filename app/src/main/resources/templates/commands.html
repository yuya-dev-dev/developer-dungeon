<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; base-uri 'none'; form-action 'self'">
  <title>Developer Dungeon | Gitコマンド一覧</title>
  <link rel="stylesheet" th:href="@{/entry.css}">
</head>
<body class="reference-page">
<main class="reference-shell">
  <a class="back-link" th:href="@{/git/stages}">← Git編へ戻る</a>
  <header><p class="reference-kicker">COMMAND REFERENCE</p><h1>Gitコマンド一覧</h1><p>ゲーム内で使用するコマンドを、基本的な確認操作から順にまとめています。</p></header>
  <div class="command-table-wrap">
    <table>
      <thead><tr><th scope="col">番号</th><th scope="col">コマンド</th><th scope="col">用途</th></tr></thead>
      <tbody><tr th:each="command : ${commands}"><td th:text="${command.number}">1</td><td><code th:text="${command.command}">git status</code></td><td th:text="${command.purpose}">状態を確認する</td></tr></tbody>
    </table>
  </div>
</main>
</body>
</html>
